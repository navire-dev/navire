---
networks:
  navire_net:
    external: true

services:
  navire-core-dev:
    build:
      context: ../..
      dockerfile: dev/core/Dockerfile
    container_name: navire-core-dev
    restart: unless-stopped
    user: 1000:1000
    working_dir: /workspace
    env_file:
      - .env
    environment:
      NAVIRE_TARGETS_DIR: /workspace/dev/config/providers
      NAVIRE_TEMPLATES_DIR: /workspace/dev/config/templates
      REDIS_ADDR: host.docker.internal
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /go/build-cache
      GOTMPDIR: /tmp/go-tmp
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${NAVIRE_HOST_PORT:-8080}:8080"
    volumes:
      - ../..:/workspace
      - ${DEV_CACHE_DIR:-/var/tmp/navire}/go-mod-cache:/go/pkg/mod
      - ${DEV_CACHE_DIR:-/var/tmp/navire}/go-build-cache:/go/build-cache
      - ${DEV_CACHE_DIR:-/var/tmp/navire}/core-go-tmp:/tmp/go-tmp
    networks:
      - navire_net
